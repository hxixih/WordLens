name: Publish Intel macOS release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]

permissions:
  contents: read

concurrency:
  group: wordlens-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'hxixih/WordLens' && github.ref == 'refs/heads/main'
    runs-on: macos-15-intel
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build, package, and test
        run: |
          bash package_release.sh
          bash test.sh
      - name: Publish download and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          task_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          task_tag="v${task_version}"
          if gh release view "$task_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $task_tag already exists; leaving it unchanged."
            exit 0
          fi
          task_notes="$RUNNER_TEMP/wordlens-release-notes.md"
          cat > "$task_notes" <<'NOTES'
          原生 macOS AI 划词翻译工具，支持网页、PDF 复制兼容模式和自定义 OpenAI 兼容接口。

          - 下载本页的 Intel ZIP 安装包，解压后将 `划词译.app` 移到应用程序目录。
          - 面向 Intel Mac；最低部署目标为 macOS 10.15，实际系统兼容情况见 README。
          - 首次运行需设置 Base URL、模型名称和 API Key，并授予辅助功能权限。
          - 应用采用临时签名，未经 Apple 公证；macOS 可能需要右键“打开”。
          - 安装包由本仓库源码构建，通过 118 项测试和签名检查；附 SHA-256 校验文件。

          使用说明：[README](https://github.com/hxixih/WordLens#readme)
          NOTES
          gh release create "$task_tag" \
            "dist/WordLens-${task_tag}-Intel.zip" \
            "dist/WordLens-${task_tag}-Intel.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "WordLens ${task_version} — Intel macOS" \
            --notes-file "$task_notes"
